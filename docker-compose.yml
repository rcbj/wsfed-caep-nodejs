services:
  wsfed-demo:
    build: .
    image: wsfed-caep-nodejs-demo
    # The host's network, so that https://localhost:8081 (the Shared Signals transmitter, polled by this
    # server) is the same address inside the container as in the browser. On Docker Desktop, turn on host
    # networking (Settings → Resources → Network).
    network_mode: host
    environment:
      PORT: ${PORT:-3000}
    volumes:
      - ./demo/generated:/app/demo/generated:ro
    stop_grace_period: 5s
